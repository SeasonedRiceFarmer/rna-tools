report_comment: >
  This report has been generated by the <a href="https://github.com/SeasonedRiceFarmer/rna-tools/tree/dev" target="_blank">SeasonedRiceFarmer/rna-tools</a>
  analysis pipeline.
report_section_order:
  "SeasonedRiceFarmer-rna-tools-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "SeasonedRiceFarmer-rna-tools-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Run the FastQC module twice — once over the raw reads, once over
# fastp's trimmed output (tagged "_trimmed" in the workflow) — so the
# report shows two labeled sections instead of merging both sets of
# samples into one FastQC table.
module_order:
  - fastqc:
      name: "FastQC (raw)"
      info: "FastQC run on the raw, untrimmed reads."
      path_filters:
        - "*_fastqc.zip"
      path_filters_exclude:
        - "*_trimmed_*_fastqc.zip"
  - fastqc:
      name: "FastQC (trimmed)"
      info: "FastQC run on reads after fastp trimming."
      path_filters:
        - "*_trimmed_*_fastqc.zip"
